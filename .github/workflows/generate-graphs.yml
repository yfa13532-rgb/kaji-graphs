
name: Generate Housework Graphs

on:
  workflow_dispatch:
    inputs:
      week_no:
        description: "週番号"
        required: true
        default: "60"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install pandas plotly

      - name: Generate graphs
        env:
          WEEK_NO: ${{ inputs.week_no }}
        run: python generate_graphs.py

      - name: Save HTML to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "week${{ inputs.week_no }}/"
          if ! git diff --cached --quiet; then
            git commit -m "Generate week ${{ inputs.week_no }} graphs"
            git push
          fi
